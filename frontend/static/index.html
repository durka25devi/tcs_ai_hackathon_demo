<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanteenIQ - AI Pricing & Combo Offer Support System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    /* Tooltip styling */
    .tooltip-container { position: relative; display: inline-flex; }
    .tooltip-text {
      visibility: hidden; opacity: 0; transition: opacity 0.2s;
      position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
      background-color: #0f172a; color: #fff; padding: 0.4rem 0.6rem;
      border-radius: 0.375rem; font-size: 0.7rem; white-space: nowrap; z-index: 50;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin;

    // Helpful glossary tooltips for canteen owners
    const GLOSSARY = {
      support: "Support: How often this combo appears across all student transactions (e.g. 5% means 5 out of 100 orders have this combo).",
      confidence: "Confidence: Given item A is in the tray, how likely is item B added too? (e.g. 70% confidence).",
      lift: "Lift: Association strength. Lift > 1.0 means items are bought together significantly more than by random coincidence.",
      contribution: "Contribution: Money left after paying for raw ingredients and paper packaging. This covers canteen rent, power, and staff wages.",
      bottleneck: "Stock Bottleneck: The item with lowest prepared stock. A combo cannot be sold more times than its rarest ingredient.",
      margin: "Contribution Margin %: (Contribution ÷ Selling Price) × 100."
    };

    function InfoTooltip({ text }) {
      return (
        <span className="tooltip-container ml-1 cursor-pointer text-slate-400 hover:text-emerald-600 transition">
          <svg className="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span className="tooltip-text">{text}</span>
        </span>
      );
    }


    function FormattedMessage({ text }) {
      if (!text) return null;
      const paragraphs = text.split("\n\n");
      return (
        <div className="space-y-3 text-xs text-slate-800 leading-relaxed font-sans">
          {paragraphs.map((p, idx) => {
            const trimmed = p.trim();
            if (!trimmed) return null;
            if (trimmed.startsWith(">")) {
              const q = trimmed.replace(/^>\s*/gm, "");
              return (
                <div key={idx} className="bg-amber-50/90 border-l-4 border-amber-500 p-3 rounded-r-xl text-amber-950 text-xs shadow-xs">
                  <span dangerouslySetInnerHTML={{ __html: renderInlineMarkdown(q) }} />
                </div>
              );
            }
            if (trimmed.startsWith("### ")) {
              return (
                <h4 key={idx} className="font-extrabold text-sm text-slate-900 pt-1 tracking-tight">
                  {trimmed.replace(/^###\s+/, "")}
                </h4>
              );
            }
            if (trimmed.startsWith("- ") || trimmed.startsWith("* ")) {
              const items = trimmed.split("\n").filter(l => l.trim().startsWith("- ") || l.trim().startsWith("* "));
              return (
                <ul key={idx} className="list-disc list-inside space-y-1 pl-1 text-slate-700">
                  {items.map((it, i) => (
                    <li key={i} dangerouslySetInnerHTML={{ __html: renderInlineMarkdown(it.replace(/^[-*]\s+/, "")) }} />
                  ))}
                </ul>
              );
            }
            return (
              <p key={idx} dangerouslySetInnerHTML={{ __html: renderInlineMarkdown(trimmed) }} />
            );
          })}
        </div>
      );
    }

    function renderInlineMarkdown(str) {
      let s = str.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>');
      s = s.replace(/`([^`]+)`/g, '<code class="bg-slate-100 text-indigo-700 px-1 py-0.5 rounded font-mono text-[11px]">$1</code>');
      return s;
    }

    function App() {
      const [activeTab, setActiveTab] = useState("overview");
      const [overview, setOverview] = useState(null);
      const [products, setProducts] = useState([]);
      const [modelMetrics, setModelMetrics] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // Search & Filters in Overview
      const [prodCategoryFilter, setProdCategoryFilter] = useState("All");

      // Combo Discovery State
      const [combos, setCombos] = useState([]);
      const [comboAlgo, setComboAlgo] = useState("fpgrowth");
      const [minSupport, setMinSupport] = useState(0.03);
      const [minConfidence, setMinConfidence] = useState(0.20);
      const [minLift, setMinLift] = useState(1.0);
      const [combosLoading, setCombosLoading] = useState(false);

      // Price Scenario State
      const [selectedPid, setSelectedPid] = useState("P101");
      const [selectedDow, setSelectedDow] = useState("Wednesday");
      const [promoActive, setPromoActive] = useState(0);
      const [priceScenarios, setPriceScenarios] = useState(null);
      const [priceLoading, setPriceLoading] = useState(false);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Combo Evaluator State
      const [evalComboItems, setEvalComboItems] = useState(["P102", "P103"]);
      const [evalProposedPrice, setEvalProposedPrice] = useState(75);
      const [evalVolume, setEvalVolume] = useState(25);
      const [evalMinMargin, setEvalMinMargin] = useState(0.25);
      const [evalBudgetLimit, setEvalBudgetLimit] = useState(80);
      const [comboEvalResult, setComboEvalResult] = useState(null);
      const [comboEvalLoading, setComboEvalLoading] = useState(false);

      // Recommendations State
      const [recBudgetLimit, setRecBudgetLimit] = useState(75);
      const [recMinMargin, setRecMinMargin] = useState(0.25);
      const [recStockBuffer, setRecStockBuffer] = useState(0.85);
      const [recommendations, setRecommendations] = useState(null);
      const [recLoading, setRecLoading] = useState(false);

      // Groq Qwen Chat Assistant State
      const [chatHistory, setChatHistory] = useState([
        {
          role: "assistant",
          content: "Hello! I am your CanteenIQ Copilot, powered by Groq Qwen. I provide intelligent reasoning and explanations for pricing decisions, combo engineering, student demand elasticity, and kitchen stock bottlenecks. How can I help you today?",
          evidence: null,
          is_llm_generated: false,
          model_used: "system"
        }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [chatLoading, setChatLoading] = useState(false);
      const [chatError, setChatError] = useState(null);
      const [llmStatus, setLlmStatus] = useState(null);
      const chatEndRef = useRef(null);

      useEffect(() => {
        fetchInitialData();
      }, []);

      const fetchInitialData = async () => {
        setLoading(true);
        setError(null);
        try {
          const [resOverview, resProds, resModel] = await Promise.all([
            fetch(`${API_BASE}/api/overview`).then(r => r.json()),
            fetch(`${API_BASE}/api/products`).then(r => r.json()),
            fetch(`${API_BASE}/api/demand-model/metrics`).then(r => r.json())
          ]);
          setOverview(resOverview);
          setProducts(resProds);
          setModelMetrics(resModel);
          if (resProds.length > 0) {
            setSelectedPid(resProds[0].product_id);
          }
          fetchCombos("fpgrowth", 0.03, 0.20, 1.0);
          fetchLlmStatus();
        } catch (err) {
          console.error(err);
          setError("Cannot connect to Canteen AI backend on port 8000. Please start uvicorn backend.");
        } finally {
          setLoading(false);
        }
      };

      const fetchLlmStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/llm/status`).then(r => r.json());
          setLlmStatus(res);
        } catch (e) {
          console.error(e);
        }
      };

      const sendChatMessage = async (msgText) => {
        const query = (msgText || chatInput).trim();
        if (!query || chatLoading) return;

        const userMsg = { role: "user", content: query };
        const updatedHistory = [...chatHistory, userMsg];
        setChatHistory(updatedHistory);
        setChatInput("");
        setChatLoading(true);
        setChatError(null);

        try {
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: query,
              history: chatHistory.map(m => ({ role: m.role, content: m.content })),
              context_hint: { activeTab, selectedPid }
            })
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Server error ${res.status}`);
          }
          const data = await res.json();
          setChatHistory([...updatedHistory, {
            role: "assistant",
            content: data.reply,
            evidence: data.evidence,
            intent: data.intent,
            model_used: data.model_used,
            is_llm_generated: data.is_llm_generated,
            status: data.status
          }]);
        } catch (err) {
          console.error(err);
          setChatError(err.message || "Failed to reach AI reasoning assistant.");
        } finally {
          setChatLoading(false);
        }
      };

      const askCopilot = (promptText) => {
        setActiveTab("assistant");
        setTimeout(() => {
          sendChatMessage(promptText);
        }, 120);
      };

      useEffect(() => {
        if (activeTab === "assistant" && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [chatHistory, activeTab]);

      const fetchCombos = async (algo, sup, conf, lift) => {
        setCombosLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/combos/discover`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              algorithm: algo,
              min_support: parseFloat(sup),
              min_confidence: parseFloat(conf),
              min_lift: parseFloat(lift)
            })
          });
          const data = await res.json();
          setCombos(data);
        } catch (err) {
          console.error(err);
        } finally {
          setCombosLoading(false);
        }
      };

      const evaluatePriceScenarios = async () => {
        if (!selectedPid) return;
        setPriceLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/pricing/evaluate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              product_id: selectedPid,
              day_of_week: selectedDow,
              promotion_active: promoActive
            })
          });
          const data = await res.json();
          setPriceScenarios(data);
        } catch (err) {
          console.error(err);
        } finally {
          setPriceLoading(false);
        }
      };

      useEffect(() => {
        if (selectedPid) {
          evaluatePriceScenarios();
        }
      }, [selectedPid, selectedDow, promoActive]);

      // Render Enhanced Dual-Axis Chart
      useEffect(() => {
        if (activeTab === "pricing" && priceScenarios && chartRef.current) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
          const ctx = chartRef.current.getContext("2d");
          const labels = priceScenarios.scenarios.map(s => `₹${s.candidate_price} ${s.is_baseline ? '(Current)' : ''}`);
          const revenues = priceScenarios.scenarios.map(s => s.estimated_daily_revenue);
          const contributions = priceScenarios.scenarios.map(s => s.estimated_daily_contribution);
          const demands = priceScenarios.scenarios.map(s => s.estimated_daily_quantity);

          chartInstance.current = new Chart(ctx, {
            type: "bar",
            data: {
              labels: labels,
              datasets: [
                {
                  label: "Gross Revenue (₹)",
                  data: revenues,
                  backgroundColor: "rgba(99, 102, 241, 0.2)",
                  borderColor: "rgba(99, 102, 241, 1)",
                  borderWidth: 1.5,
                  borderRadius: 6,
                  yAxisID: "y"
                },
                {
                  label: "Canteen Contribution (₹)",
                  data: contributions,
                  backgroundColor: "rgba(16, 185, 129, 0.85)",
                  borderColor: "rgba(16, 185, 129, 1)",
                  borderWidth: 1.5,
                  borderRadius: 6,
                  yAxisID: "y"
                },
                {
                  type: "line",
                  label: "Estimated Daily Demand (Units Sold)",
                  data: demands,
                  borderColor: "rgba(249, 115, 22, 1)",
                  backgroundColor: "rgba(249, 115, 22, 1)",
                  borderWidth: 3,
                  pointRadius: 6,
                  pointHoverRadius: 8,
                  tension: 0.2,
                  yAxisID: "y1"
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: {
                legend: { position: "top", labels: { font: { family: "Plus Jakarta Sans", size: 12 } } },
                tooltip: {
                  backgroundColor: "#0f172a",
                  padding: 12,
                  titleFont: { family: "Plus Jakarta Sans", weight: "bold" },
                  bodyFont: { family: "Plus Jakarta Sans" },
                  callbacks: {
                    label: function(context) {
                      let label = context.dataset.label || '';
                      if (label) {
                        label += ': ';
                      }
                      if (context.datasetIndex === 2) {
                        label += context.parsed.y + ' portions';
                      } else {
                        label += '₹' + context.parsed.y.toLocaleString();
                      }
                      return label;
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: true, text: "Financial Amount (₹)", font: { weight: "600" } },
                  grid: { color: "rgba(226, 232, 240, 0.6)" }
                },
                y1: {
                  position: "right",
                  beginAtZero: true,
                  title: { display: true, text: "Units Sold", font: { weight: "600" } },
                  grid: { drawOnChartArea: false }
                }
              }
            }
          });
        }
      }, [activeTab, priceScenarios]);

      const evaluateComboOffer = async () => {
        if (!evalComboItems || evalComboItems.length === 0) return;
        setComboEvalLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/combos/evaluate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              combo_items: evalComboItems,
              proposed_price: parseFloat(evalProposedPrice),
              assumed_daily_volume: parseInt(evalVolume),
              min_contribution_margin: parseFloat(evalMinMargin),
              student_budget_limit: parseFloat(evalBudgetLimit)
            })
          });
          const data = await res.json();
          setComboEvalResult(data);
        } catch (err) {
          console.error(err);
        } finally {
          setComboEvalLoading(false);
        }
      };

      const fetchRecommendations = async () => {
        setRecLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/recommendations`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              max_student_budget: parseFloat(recBudgetLimit),
              min_contribution_margin: parseFloat(recMinMargin),
              stock_buffer_safety_pct: parseFloat(recStockBuffer)
            })
          });
          const data = await res.json();
          setRecommendations(data);
        } catch (err) {
          console.error(err);
        } finally {
          setRecLoading(false);
        }
      };

      useEffect(() => {
        if (activeTab === "recommendations" && !recommendations) {
          fetchRecommendations();
        }
      }, [activeTab]);

      const filteredProducts = products.filter(p => {
        if (prodCategoryFilter === "All") return true;
        return p.category === prodCategoryFilter;
      });

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Top Navigation Bar */}
          <header className="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-emerald-900/30">
                  ₹
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-lg font-bold tracking-tight text-white">CanteenIQ</h1>
                    <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                      AI Decision Support
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Smart Pricing & Combo Engineering for College Canteens</p>
                </div>
              </div>

              {/* Navigation Pill Buttons */}
              <nav className="flex items-center space-x-1.5 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 overflow-x-auto">
                {[
                  { id: "overview", label: "Overview", icon: "📊" },
                  { id: "discovery", label: "Combo Discovery", icon: "🔍" },
                  { id: "pricing", label: "Price Simulator", icon: "📈" },
                  { id: "evaluator", label: "Combo Evaluator", icon: "🍱" },
                  { id: "recommendations", label: "Recommendations", icon: "💡" },
                  { id: "assistant", label: "AI Copilot", icon: "💬" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all whitespace-nowrap ${
                      activeTab === tab.id
                        ? "bg-emerald-600 text-white shadow-sm"
                        : "text-slate-300 hover:text-white hover:bg-slate-700/50"
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Quick Help / AI Status Banner */}
          <div className="bg-emerald-50/70 border-b border-emerald-200/60 px-4 sm:px-6 py-2 text-xs text-emerald-950 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center space-x-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span className="font-semibold text-emerald-900">How to use this tool:</span>
              <span className="text-emerald-800 hidden sm:inline">
                Discover popular combinations, simulate student price elasticity, test combo offers, and review automated profit-optimizing advice.
              </span>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              {modelMetrics && (
                <div className="flex items-center space-x-2 text-[11px] bg-white px-2.5 py-1 rounded-md border border-emerald-200 font-mono text-emerald-900 shadow-2xs">
                  <span>Demand ML: Random Forest</span>
                  <span>•</span>
                  <span className="text-emerald-700 font-semibold">MAE: {modelMetrics.model_mae}</span>
                </div>
              )}
              {llmStatus && (
                <div className="flex items-center space-x-2 text-[11px] bg-white px-2.5 py-1 rounded-md border border-purple-200 font-mono text-purple-950 shadow-2xs">
                  <span className={`w-2 h-2 rounded-full ${llmStatus.configured ? 'bg-emerald-500 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span>Qwen: {llmStatus.model}</span>
                  <span className="text-slate-400 font-sans">({llmStatus.configured ? 'Groq Live' : 'Deterministic Mode'})</span>
                </div>
              )}
            </div>
          </div>

          {/* Main Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-800 p-4 rounded-xl flex items-center justify-between shadow-sm">
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 font-bold">!</div>
                  <div>
                    <p className="font-bold text-sm">{error}</p>
                    <p className="text-xs text-red-600 mt-0.5">Start server: <code className="bg-red-100/80 px-1 py-0.5 rounded font-mono">PYTHONPATH=. python3 -m uvicorn backend.main:app --reload</code></p>
                  </div>
                </div>
                <button
                  onClick={fetchInitialData}
                  className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-700 transition"
                >
                  Retry Connection
                </button>
              </div>
            )}

            {loading ? (
              <div className="flex flex-col items-center justify-center py-28 text-slate-500">
                <div className="w-12 h-12 border-4 border-slate-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
                <p className="text-sm font-semibold text-slate-700">Loading Canteen Intelligence Engine...</p>
                <p className="text-xs text-slate-400 mt-1">Crunching 4,500+ order baskets and training Random Forest models</p>
              </div>
            ) : (
              <>
                {/* ============================================================== */}
                {/* 1. OVERVIEW VIEW */}
                {/* ============================================================== */}
                {activeTab === "overview" && overview && (
                  <div className="space-y-6">
                    {/* Welcome Banner */}
                    <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 text-white p-6 rounded-2xl shadow-md flex flex-wrap justify-between items-center gap-4">
                      <div className="space-y-1">
                        <h2 className="text-xl font-bold tracking-tight">Canteen Business Snapshot</h2>
                        <p className="text-xs text-slate-300 max-w-2xl">
                          Based on {overview.total_transactions.toLocaleString()} student transaction orders recorded between {overview.date_range_start} and {overview.date_range_end}.
                        </p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setActiveTab("recommendations")}
                          className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm flex items-center space-x-1.5"
                        >
                          <span>View AI Recommendations</span>
                          <span>→</span>
                        </button>
                      </div>
                    </div>

                    {/* 4 Financial KPI Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      {/* Orders */}
                      <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs hover:border-slate-300 transition">
                        <div className="flex justify-between items-start">
                          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Orders</p>
                          <span className="p-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs">🧾</span>
                        </div>

                                Deterministic Engine Active
                              </span>
                            )}
                          </div>
                          <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                            Model: {llmStatus ? llmStatus.model : "qwen-2.5-32b"}
                          </div>
                        </div>
                        <button
                          onClick={() => setChatHistory([
                            {
                              role: "assistant",
                              content: "Conversation history cleared. What would you like to explore regarding canteen pricing or combo deals?",
                              evidence: null,
                              is_llm_generated: false,
                              model_used: "system"
                            }
                          ])}
                          className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 transition shadow-xs"
                        >
                          Clear Chat
                        </button>
                      </div>
                    </div>

                    {/* Quick Question Prompts */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2">
                      <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                        <span>⚡</span>
                        <span>Suggested Inquiries (Click to Ask):</span>
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { label: "🍟 Why reduce French fries price?", q: "Why should we reduce the price of French fries?" },
                          { label: "🍱 Best affordable combo?", q: "Which combo provides the best contribution while remaining affordable?" },
                          { label: "🥪 Reduce sandwich price by ₹5?", q: "What happens if we reduce the sandwich price by ₹5?" },
                          { label: "📊 Contribution vs Revenue?", q: "Explain contribution versus revenue using our canteen data." },
                          { label: "⚠️ Stock bottlenecks?", q: "Which products have stock bottlenecks?" },
                          { label: "📈 Compare pricing scenarios", q: "Compare two pricing scenarios." }
                        ].map((prompt, idx) => (
                          <button
                            key={idx}
                            onClick={() => sendChatMessage(prompt.q)}
                            disabled={chatLoading}
                            className="bg-slate-50 hover:bg-purple-50 hover:border-purple-300 hover:text-purple-900 border border-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-2xs"
                          >
                            {prompt.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Chat Conversation Thread */}
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col min-h-[500px]">
                      <div className="p-4 sm:p-6 space-y-6 flex-1 overflow-y-auto max-h-[620px]">
                        {chatHistory.map((msg, idx) => (
                          <div
                            key={idx}
                            className={`flex flex-col ${msg.role === "user" ? "items-end" : "items-start"}`}
                          >
                            {msg.role === "user" ? (
                              <div className="max-w-2xl bg-indigo-600 text-white p-4 rounded-2xl rounded-tr-xs shadow-sm">
                                <p className="text-xs font-medium whitespace-pre-wrap">{msg.content}</p>
                              </div>
                            ) : (
                              <div className="max-w-3xl w-full bg-slate-50 border border-slate-200 p-5 rounded-2xl rounded-tl-xs shadow-xs space-y-4">
                                {/* Header badge */}
                                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/80 pb-2.5">
                                  <div className="flex items-center space-x-2">
                                    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                      msg.is_llm_generated
                                        ? "bg-purple-100 text-purple-800 border border-purple-200"
                                        : "bg-emerald-100 text-emerald-800 border border-emerald-200"
                                    }`}>
                                      {msg.is_llm_generated ? "✨ Groq Qwen 2.5-32B AI Reasoning" : "⚙️ Verified Deterministic Calculation Engine"}
                                    </span>
                                    {msg.intent && (
                                      <span className="font-mono text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded">
                                        #{msg.intent}
                                      </span>
                                    )}
                                  </div>
                                  <span className="text-[10px] text-slate-400 font-mono">
                                    Model: {msg.model_used || "deterministic"}
                                  </span>
                                </div>

                                {/* Verified Numerical Evidence Box (if attached) */}
                                {msg.evidence && (
                                  <div className="p-4 bg-slate-900 text-slate-100 rounded-xl text-xs space-y-3 border border-slate-700 shadow-inner">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                      <div className="flex items-center space-x-2">
                                        <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">
                                          📊 Verified Engine Evidence
                                        </span>
                                        <span className="text-slate-200 font-semibold">{msg.evidence.headline}</span>
                                      </div>
                                    </div>

                                    {/* Metrics Grid */}
                                    {msg.evidence.metrics && (
                                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                                        {Object.entries(msg.evidence.metrics)
                                          .filter(([_, v]) => typeof v === "number" || (typeof v === "string" && v.length < 25))
                                          .slice(0, 8)
                                          .map(([k, v]) => (
                                            <div key={k} className="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/60">
                                              <div className="text-[10px] text-slate-400 capitalize">{k.replace(/_/g, " ")}</div>
                                              <div className="text-sm font-bold text-white mt-0.5">
                                                {typeof v === "number"
                                                  ? (k.includes("price") || k.includes("revenue") || k.includes("cost") || k.includes("contribution") || k.includes("delta") || k.includes("budget")
                                                      ? `₹${v.toFixed(1)}`
                                                      : v)
                                                  : v}
                                              </div>
                                            </div>
                                          ))}
                                      </div>
                                    )}

                                    {/* Table View */}
                                    {msg.evidence.table && msg.evidence.table.length > 0 && (
                                      <div className="overflow-x-auto mt-2">
                                        <table className="w-full text-left text-[11px] border-collapse">
                                          <thead>
                                            <tr className="border-b border-slate-800 text-slate-400">
                                              {Object.keys(msg.evidence.table[0]).map(col => (
                                                <th key={col} className="py-1 px-2 font-semibold">{col}</th>
                                              ))}
                                            </tr>
                                          </thead>
                                          <tbody className="divide-y divide-slate-800/50">
                                            {msg.evidence.table.map((row, rIdx) => (
                                              <tr key={rIdx} className="hover:bg-slate-800/40">
                                                {Object.values(row).map((val, cIdx) => (
                                                  <td key={cIdx} className="py-1.5 px-2 font-mono text-slate-200">{String(val)}</td>
                                                ))}
                                              </tr>
                                            ))}
                                          </tbody>
                                        </table>
                                      </div>
                                    )}

                                    {msg.evidence.notes && (
                                      <div className="text-[11px] text-slate-400 italic pt-1 border-t border-slate-800">
                                        💡 {msg.evidence.notes}
                                      </div>
                                    )}
                                  </div>
                                )}

                                {/* Natural Language Reasoning Explanation */}
                                <FormattedMessage text={msg.content} />
                              </div>
                            )}
                          </div>
                        ))}

                        {/* Loading Indicator */}
                        {chatLoading && (
                          <div className="flex items-start max-w-xl">
                            <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl rounded-tl-xs shadow-xs space-y-2">
                              <div className="flex items-center space-x-2 text-xs text-purple-700 font-semibold">
                                <div className="w-4 h-4 border-2 border-purple-300 border-t-purple-600 rounded-full animate-spin"></div>
                                <span>Groq Qwen 2.5-32B is evaluating evidence & composing reasoning...</span>
                              </div>
                              <p className="text-[11px] text-slate-400">Grounding explanation in empirical demand and financial margins</p>
                            </div>
                          </div>
                        )}

                        {/* Error Card */}
                        {chatError && (
                          <div className="bg-red-50 border border-red-200 text-red-800 p-3.5 rounded-xl text-xs flex justify-between items-center">
                            <div>
                              <p className="font-bold">Error retrieving reasoning response:</p>
                              <p className="text-red-600 mt-0.5">{chatError}</p>
                            </div>
                            <button
                              onClick={() => sendChatMessage(chatInput)}
                              className="bg-red-600 text-white px-3 py-1 rounded-lg font-bold hover:bg-red-700 transition"
                            >
                              Retry
                            </button>
                          </div>
                        )}

                        <div ref={chatEndRef} />
                      </div>

                      {/* Chat Input Bar */}
                      <div className="p-4 border-t border-slate-200 bg-slate-50/50 rounded-b-2xl">
                        <form
                          onSubmit={(e) => {
                            e.preventDefault();
                            sendChatMessage();
                          }}
                          className="flex items-center gap-2"
                        >
                          <input
                            type="text"
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            placeholder="Ask Copilot anything about pricing, combo offers, contribution margins, or stock bottlenecks..."
                            disabled={chatLoading}
                            className="flex-1 text-xs p-3 border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium"
                          />
                          <button
                            type="submit"
                            disabled={chatLoading || !chatInput.trim()}
                            className="bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white px-5 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm"
                          >
                            <span>Send</span>
                            <span>→</span>
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
              <span>CanteenIQ &copy; 2026. AI-Powered Pricing & Combo Offer Support System.</span>
              <span className="font-mono text-[11px] text-slate-400">FastAPI • Scikit-learn • MLxtend • React</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
